name: build
on:
  workflow_dispatch:
    inputs:
      config:
        description: Konfigurasi build (JSON)
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CFG: ${{ inputs.config }}
      RUN: ${{ github.run_number }}
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
    steps:
      - name: Checkout template
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install Python tools
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Run generator tests
        run: python -m unittest discover -s tests -v
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null
      - name: Prepare source
        id: prep
        run: python tools/generate.py prep
      - name: Setup Node
        if: steps.prep.outputs.kind == 'web' || steps.prep.outputs.kind == 'capacitor' || steps.prep.outputs.kind == 'rn'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Flutter
        if: steps.prep.outputs.kind == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        if: steps.prep.outputs.kind == 'generated' || steps.prep.outputs.kind == 'web'
        run: python tools/generate.py gen
      - name: Build
        run: bash .build.sh
      - name: Verify build outputs
        run: |
          test -d dist || { echo "::error::Folder dist tidak ditemukan."; exit 1; }
          find dist -maxdepth 1 -type f -size +0c -print -quit | grep -q . || { echo "::error::Tidak ada artefak build yang valid."; exit 1; }
      - name: Collect output
        id: collect
        run: python tools/generate.py collect
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexabuild-output-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.collect.outputs.tag }}" dist/* \
            --title "${{ steps.collect.outputs.tag }}" \
            --notes-file build_app/.notes
      - name: Cleanup temporary upload
        if: always()
        run: |
          ZIP=$(python -c 'import json,os; print(json.loads(os.environ["CFG"]).get("zip", ""))')
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            git config user.name nexabuild
            git config user.email nexabuild@users.noreply.github.com
            git rm -q -f -- "$ZIP" || true
            if ! git diff --cached --quiet; then
              git commit -q -m "chore: remove temporary source archive"
              git push
            fi
          fi
