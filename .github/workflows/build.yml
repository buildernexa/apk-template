name: build
on:
  workflow_dispatch:
    inputs:
      config:
        description: Konfigurasi build (JSON)
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CFG: ${{ inputs.config }}
      RUN: ${{ github.run_number }}
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate project
        run: python3 tools/generate.py
      - name: Build
        run: gradle -p build_app $(cat build_app/.args) --no-daemon --stacktrace
      - name: Collect output
        id: collect
        run: python3 tools/generate.py collect
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: dist/*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.collect.outputs.tag }}" dist/* --title "${{ steps.collect.outputs.tag }}" --notes "Build ${{ github.run_number }}"
